name: Stable Core Build

on:
  workflow_dispatch:
  push:
    branches:
      - custom/stable-input-v0

jobs:
  build-macos-core:
    name: macOS ARM64 core
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select stable Rust
        run: rustup default stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test input capture
        run: cargo test -p input-capture --no-default-features
      - name: Build core
        run: cargo build --release --no-default-features
      - name: Upload macOS core
        uses: actions/upload-artifact@v4
        with:
          name: lan-mouse-stable-macos-arm64
          path: target/release/lan-mouse

  build-windows-core:
    name: Windows x64 core
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Select stable Rust
        run: rustup default stable
      - name: Check Windows capture code
        run: cargo check -p input-capture --no-default-features
      - name: Build core
        run: cargo build --release --no-default-features
      - name: Upload Windows core
        uses: actions/upload-artifact@v4
        with:
          name: lan-mouse-stable-windows-x64
          path: target/release/lan-mouse.exe

  build-windows-app:
    name: Windows x64 中文图形版
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-rust
      - name: Build graphical app
        shell: msys2 {0}
        env:
          PKG_CONFIG_PATH: /ucrt64/lib/pkgconfig
          CARGO_HOME: /tmp/cargo-home
        run: /ucrt64/bin/cargo build --release
      - name: Assemble portable package
        shell: pwsh
        run: |
          $package = 'dist/yangyang-remote-control-windows-x64'
          $msysLauncher = Join-Path (Join-Path $env:RUNNER_TEMP 'setup-msys2') 'msys2.cmd'
          $ucrtRoot = (& $msysLauncher -c 'cygpath -w /ucrt64').Trim()
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          New-Item -ItemType Directory -Force -Path "$package/lib" | Out-Null
          Copy-Item 'target/release/lan-mouse.exe' "$package/阳阳的远控.exe"
          Copy-Item (Join-Path $ucrtRoot 'bin/*.dll') $package
          Copy-Item (Join-Path $ucrtRoot 'share') "$package/share" -Recurse
          Copy-Item (Join-Path $ucrtRoot 'lib/gdk-pixbuf-2.0') "$package/lib/gdk-pixbuf-2.0" -Recurse
          Copy-Item 'README.md' "$package/README.md"
          Compress-Archive -Path "$package/*" -DestinationPath 'dist/yangyang-remote-control-windows-x64.zip'
      - name: Upload Windows graphical app
        uses: actions/upload-artifact@v4
        with:
          name: yangyang-remote-control-windows-x64
          path: dist/yangyang-remote-control-windows-x64.zip
